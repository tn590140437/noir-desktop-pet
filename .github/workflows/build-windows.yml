name: Build Noir for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Noir.exe
        run: pyinstaller --clean --noconfirm Noir.spec

      - name: Upload Noir.exe
        uses: actions/upload-artifact@v4
        with:
          name: Noir-V004-Windows-Portable
          path: dist/Noir_v004.exe
          if-no-files-found: error
          retention-days: 30
